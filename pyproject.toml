[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinomial-tree"
version = "0.1.0"
description = "Recombining trinomial tree pricer for equity options (vanilla, digitals, barriers) with discrete dividend support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.3.3",
    "plotly>=6.5.0",
    "scipy>=1.16.3",
]

[project.urls]
Homepage = "https://github.com/enzomontariol/trinomial_tree"

[project.license]
file = "LICENSE.md"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
    "nbformat>=5.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Pinned explicitly so a new ruff release cannot silently change what CI
# enforces. Without this the run depends on whatever the installed ruff
# happens to default to.
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Deliberately the set that was already being enforced before this config
# existed. E501 and the PLR complexity rules are left out: they fire ~50 times
# on the existing code and reformatting it is a separate decision, not a
# CI fix.
select = [
    "E4", "E7", "E9",  # pycodestyle (not E501 line-length)
    "F",               # pyflakes
    "I",               # import sorting
    "UP",              # pyupgrade
    "B",               # bugbear
    "C4",              # comprehensions
    "SIM",             # simplify
    "PIE",             # misc lints
    "BLE",             # blind except
    "PLC", "PLE", "PLW",  # pylint (not PLR refactor/complexity)
    "RUF",             # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks in the showcase deliberately swallow failures so one bad run
# does not kill the whole sweep.
"trinomial_tree_showcase.ipynb" = ["BLE001"]
# Tests use magic numbers and long asserts by design.
"tests/**" = ["PLR2004"]

